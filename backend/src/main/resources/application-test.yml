spring:
  datasource:
    url: jdbc:h2:mem:habesh;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
app:
  jwt:
    secret: test-secret-key-must-be-at-least-32-bytes-long-xx
    expiration-ms: 3600000
