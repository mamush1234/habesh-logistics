server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /

spring:
  application:
    name: habesh-logistics
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/habesh}
    username: ${DB_USER:habesh}
    password: ${DB_PASSWORD:habesh}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
    open-in-view: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

app:
  jwt:
    secret: ${JWT_SECRET:change-me-in-prod-this-must-be-at-least-32-bytes-long-base64-ok}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}
  pricing:
    default-rate-per-kg: ${DEFAULT_RATE_PER_KG:10.00}
    default-pickup-fee: ${DEFAULT_PICKUP_FEE:15.00}
    document-fee: ${DOCUMENT_FEE:10.00}
    medicine-fee: ${MEDICINE_FEE:15.00}
    default-commission-rate: ${DEFAULT_COMMISSION_RATE:0.10}
  alexandria:
    address: ${ALEXANDRIA_ADDRESS:1234 King St, Alexandria, VA 22314}
    hours: ${ALEXANDRIA_HOURS:Mon-Sat 9AM-7PM}

logging:
  level:
    org.springframework.security: INFO
    com.habeshlist: INFO

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /api-docs
