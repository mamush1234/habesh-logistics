version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: habesh-db
    environment:
      POSTGRES_DB: habesh
      POSTGRES_USER: habesh
      POSTGRES_PASSWORD: habesh
    ports:
      - "5432:5432"
    volumes:
      - habesh-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U habesh -d habesh"]
      interval: 5s
      timeout: 3s
      retries: 10

  adminer:
    image: adminer:latest
    container_name: habesh-adminer
    depends_on:
      db:
        condition: service_healthy
    environment:
      ADMINER_DEFAULT_SERVER: db
    ports:
      - "8081:8080"

  backend:
    build: ./backend
    container_name: habesh-backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/habesh
      DB_USER: habesh
      DB_PASSWORD: habesh
      JWT_SECRET: this-is-a-dev-secret-change-me-at-least-32-bytes-long
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8080
    container_name: habesh-frontend
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  habesh-db-data:
