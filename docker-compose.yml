services:
  db:
    image: postgres:16-alpine
    container_name: habesh-db
    environment:
      POSTGRES_DB: habesh
      POSTGRES_USER: habesh
      POSTGRES_PASSWORD: habesh
    volumes:
      - habesh-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U habesh -d habesh"]
      interval: 5s
      timeout: 3s
      retries: 10

  adminer:
    profiles: ["tools"]
    image: adminer:latest
    container_name: habesh-adminer
    depends_on:
      db:
        condition: service_healthy
    environment:
      ADMINER_DEFAULT_SERVER: db
    ports:
      - "127.0.0.1:8081:8080"

  backend:
    build: ./backend
    container_name: habesh-backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/habesh
      DB_USER: habesh
      DB_PASSWORD: habesh
      JWT_SECRET: ${JWT_SECRET:?Set a unique random JWT_SECRET in .env}
      SPRING_PROFILES_ACTIVE: dev
      DEMO_DATA_ENABLED: "true"
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173
      INVITATION_EMAIL_ENABLED: ${INVITATION_EMAIL_ENABLED:-false}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-habeshalist@gmail.com}
      APP_WEBSITE_URL: ${APP_WEBSITE_URL:-http://localhost:3000}
    ports:
      - "127.0.0.1:8080:8080"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8080
    container_name: habesh-frontend
    depends_on:
      - backend
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  habesh-db-data:
